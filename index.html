<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADIDAS | GAZA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; font-family: Arial, sans-serif; color: #fff; overflow: hidden; }

  /* الدائرة البيضاء */
  .circle {
    position: fixed;
    top: 5vh;
    right: -66vh;
    width: 136vh;
    height: 136vh;
    background: #fff;
    border-radius: 50%;
  }

  /* المستطيل الزجاجي */
  .glass {
    position: fixed;
    top: 9vh;
    left: 9.5vw;
    width: 81vw;
    height: 84vh;
    height: 84dvh;
    padding: 4vh 6vw;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    background: rgba(120, 120, 120, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
  }

  nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .logo { font-size: 44px; font-weight: 900; letter-spacing: 3px; }
  nav ul { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; }

  /* أزرار القائمة */
  nav a {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    transition: background .2s, color .2s, box-shadow .2s, transform .2s;
  }
  nav a:hover,
  nav a:active,
  nav a:focus-visible {
    background: #fff;
    color: #000;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.4);
    transform: translateY(2px) scale(0.95);
    outline: none;
  }

  .hero {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1fr);
    align-items: center;
    gap: 4vw;
  }
  .text h2 { font-size: clamp(28px, 4vw, 52px); line-height: 1.1; text-transform: uppercase; margin-bottom: 16px; }
  .text p { font-size: 14px; line-height: 1.6; max-width: 340px; }

  /* مساحة الصورة */
  .image { position: relative; width: 100%; height: 100%; }
  .image img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* تابلت */
  @media (max-width: 1024px) {
    .logo { font-size: 36px; }
    nav a { padding: 7px 14px; }
  }

  /* جوال (عمودي) */
  @media (max-width: 700px) {
    .circle {
      top: auto;
      bottom: -15vw;
      right: -55vw;
      width: 115vw;
      height: 115vw;
    }
    .glass {
      top: 3vh;
      left: 5vw;
      width: 90vw;
      height: 94vh;
      height: 94dvh;
      padding: 3vh 5vw;
      border-radius: 20px;
    }
    nav { flex-direction: column; gap: 10px; }
    .logo { font-size: 32px; }
    nav ul { justify-content: center; gap: 6px; }
    nav a { padding: 6px 12px; font-size: 13px; }

    .hero {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 2vh;
      text-align: center;
    }
    .text h2 { font-size: clamp(22px, 7vw, 34px); margin-bottom: 10px; }
    .text p { font-size: 13px; max-width: none; }
  }

  /* جوال بالوضع الأفقي أو شاشة قصيرة */
  @media (max-height: 480px) and (orientation: landscape) {
    .glass { top: 4vh; height: 92vh; padding: 2vh 4vw; }
    .logo { font-size: 24px; }
    nav a { padding: 4px 10px; font-size: 12px; }
    .text h1 { font-size: 22px; margin-bottom: 6px; }
    .text p { font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="circle"></div>

  <div class="glass">
    <nav>
      <div class="logo">ADIDAS</div>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Men</a></li>
        <li><a href="#">Women</a></li>
        <li><a href="#">Kids</a></li>
      </ul>
    </nav>

    <section class="hero">
      <div class="text">
        <h2>Adidas company is the best</h2>
        <p>Adidas is one of the best and finest footwear and sportswear companies; it is undoubtedly the best.</p>
      </div>
      <div class="image">
        <img src="p/shoe.png" alt="حذاء أديداس">
      </div>
    </section>
  </div>
</body>
</html>

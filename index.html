<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADIDAS | GAZA</title>
<head><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"></head>
<style>
  /* ===== الخط الجديد ===== */
html, body { font-family: 'Poppins', Arial, sans-serif; }
.text h1 { font-weight: 800; }
.text p { margin-bottom: 24px; }

/* ===== زر Shop Now ===== */
.btn {
  display: inline-block;
  padding: 14px 34px;
  border-radius: 999px;
  background: #fff;
  color: #000;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 1px;
  text-decoration: none;
  transition: transform .25s, box-shadow .25s;
}
.btn:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
}
.btn:active { transform: scale(0.97); }

/* ===== حركة الحذاء ===== */
.image img {
  animation: float 4s ease-in-out infinite;
  transition: rotate .5s ease, scale .5s ease;
  filter: drop-shadow(0 20px 18px rgba(0, 0, 0, 0.45));
}
.image:hover img { rotate: -8deg; scale: 1.08; }

.image::after {
  content: "";
  position: absolute;
  left: 20%;
  right: 20%;
  bottom: 4%;
  height: 16px;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 50%;
  filter: blur(10px);
  animation: shadow 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-14px); }
}
@keyframes shadow {
  0%, 100% { transform: scaleX(1);  opacity: .35; }
  50%      { transform: scaleX(.8); opacity: .2; }
}

/* ===== الظهور التدريجي ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
nav      { animation: fadeUp .8s ease both; }
.text h1 { animation: fadeUp .8s ease .2s both; }
.text p  { animation: fadeUp .8s ease .4s both; }
.btn     { animation: fadeUp .8s ease .6s both; }
.image   { animation: fadeUp 1s ease .5s both; }

/* ===== الجوال ===== */
@media (max-width: 700px) {
  .text p { margin-bottom: 14px; }
  .btn { padding: 11px 28px; font-size: 14px; }
}

/* لمن يفضّل بدون حركة */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; font-family: Arial, sans-serif; color: #fff; overflow: hidden; }

  /* الدائرة البيضاء */
  .circle {
    position: fixed;
    top: 5vh;
    right: -66vh;
    width: 136vh;
    height: 136vh;
    background: #fff;
    border-radius: 50%;
  }

  /* المستطيل الزجاجي */
  .glass {
    position: fixed;
    top: 9vh;
    left: 9.5vw;
    width: 81vw;
    height: 84vh;
    height: 84dvh;
    padding: 4vh 6vw;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    background: rgba(120, 120, 120, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
  }

  nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .logo { font-size: 44px; font-weight: 900; letter-spacing: 3px; }
  nav ul { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; }

  /* أزرار القائمة */
  nav a {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    transition: background .2s, color .2s, box-shadow .2s, transform .2s;
  }
  nav a:hover,
  nav a:active,
  nav a:focus-visible {
    background: #fff;
    color: #000;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.4);
    transform: translateY(2px) scale(0.95);
    outline: none;
  }

  .hero {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1fr);
    align-items: center;
    gap: 4vw;
  }
  .text h2 { font-size: clamp(28px, 4vw, 52px); line-height: 1.1; text-transform: uppercase; margin-bottom: 16px; }
  .text p { font-size: 14px; line-height: 1.6; max-width: 340px; }

  /* مساحة الصورة */
  .image { position: relative; width: 100%; height: 100%; }
  .image img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* تابلت */
  @media (max-width: 1024px) {
    .logo { font-size: 36px; }
    nav a { padding: 7px 14px; }
  }

  /* جوال (عمودي) */
  @media (max-width: 700px) {
    .circle {
      top: auto;
      bottom: -15vw;
      right: -55vw;
      width: 115vw;
      height: 115vw;
    }
    .glass {
      top: 3vh;
      left: 5vw;
      width: 90vw;
      height: 94vh;
      height: 94dvh;
      padding: 3vh 5vw;
      border-radius: 20px;
    }
    nav { flex-direction: column; gap: 10px; }
    .logo { font-size: 32px; }
    nav ul { justify-content: center; gap: 6px; }
    nav a { padding: 6px 12px; font-size: 13px; }

    .hero {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 2vh;
      text-align: center;
    }
    .text h2 { font-size: clamp(22px, 7vw, 34px); margin-bottom: 10px; }
    .text p { font-size: 13px; max-width: none; }
  }

  /* جوال بالوضع الأفقي أو شاشة قصيرة */
  @media (max-height: 480px) and (orientation: landscape) {
    .glass { top: 4vh; height: 92vh; padding: 2vh 4vw; }
    .logo { font-size: 24px; }
    nav a { padding: 4px 10px; font-size: 12px; }
    .text h1 { font-size: 22px; margin-bottom: 6px; }
    .text p { font-size: 11px; }
  }
  /* ===== اللون المميز (6) ===== */
:root { --accent: #ff3b3b; --accent-glow: rgba(255, 59, 59, 0.45); }
.accent { color: var(--accent); }

/* ===== شعاع الضوء خلف الحذاء (5) ===== */
.image::before {
  content: "";
  position: absolute;
  inset: 8%;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
  filter: blur(30px);
  animation: pulse 4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: .7; transform: scale(1); }
  50%      { opacity: 1;  transform: scale(1.1); }
}

/* ===== تأثير الماوس (8) ===== */
.circle { translate: calc(var(--mx, 0) * 25px) calc(var(--my, 0) * 25px); transition: translate .3s ease-out; }
.image  { translate: calc(var(--mx, 0) * -22px) calc(var(--my, 0) * -22px); transition: translate .3s ease-out; }

/* ===== الأقسام تحت الصفحة (7) ===== */
.glass { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.3) transparent; }
.hero { flex: none; height: 62vh; }

.products { padding: 6vh 0 2vh; }
.products h2 { font-size: clamp(22px, 3vw, 34px); font-weight: 800; margin-bottom: 24px; text-transform: uppercase; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

.card {
  text-align: center;
  padding: 20px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 20px;
  transition: transform .3s, box-shadow .3s;
}
.card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); }
.card img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; margin-bottom: 12px; }
.card h3 { font-size: 18px; margin-bottom: 4px; }
.price { color: var(--accent); font-weight: 600; font-size: 18px; margin-bottom: 14px; }

.buy {
  display: inline-block;
  padding: 10px 26px;
  border-radius: 999px;
  background: #fff;
  color: #000;
  font-weight: 600;
  text-decoration: none;
  transition: transform .25s, box-shadow .25s;
}
.buy:hover { transform: scale(1.06); box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }

@media (max-width: 700px) {
  .hero { height: 85vh; }
  .cards { grid-template-columns: 1fr; }
}
/* ===== إصلاح التداخل ===== */
.glass > * { flex-shrink: 0; }

/* ===== إصلاح الجوال ===== */
@media (max-width: 700px) {
  .glass { background: rgba(20, 20, 20, 0.6); }

  .hero {
    display: flex;
    flex-direction: column;
    height: auto;
    gap: 16px;
    padding: 3vh 0;
  }
  .image { height: 38vh; flex: none; }

  .products { padding: 5vh 0 2vh; }
  .card { padding: 16px; }
  .card img { aspect-ratio: 16 / 10; }
}
</style>
</head>
<body>
  <div class="circle"></div>

  <div class="glass">
    <nav>
      <div class="logo">ADIDAS</div>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Men</a></li>
        <li><a href="#">Women</a></li>
        <li><a href="#">Kids</a></li>
      </ul>
    </nav>

    <section class="hero">
      <section class="products">
  <h2>Our Products</h2>
  <div class="cards">
    <div class="card">
      <img src="p/shoe.png" alt="Product 1">
      <h3>Classic Runner</h3>
      <p class="price">$120</p>
      <a href="#" class="buy">Buy Now</a>
    </div>
    <div class="card">
      <img src="p/shoe.png" alt="Product 2">
      <h3>Street Pro</h3>
      <p class="price">$150</p>
      <a href="#" class="buy">Buy Now</a>
    </div>
    <div class="card">
      <img src="p/shoe.png" alt="Product 3">
      <h3>Speed Max</h3>
      <p class="price">$180</p>
      <a href="#" class="buy">Buy Now</a>
    </div>
  </div>
</section>
      <div class="text">
        <h2>Adidas company is the best</h2>
        <p>Adidas is one of the best and finest footwear and sportswear companies; it is undoubtedly the best.</p>
        <a href="#" class="btn">Shop Now</a>
      </div>
      <div class="image">
        <img src="p/shoe.png" alt="حذاء أديداس">
      </div>
    </section>
  </div>
</body>
</html>

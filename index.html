<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADIDAS | GAZA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #ff3b3b; --accent-glow: rgba(255, 59, 59, 0.45); }
  html, body { height: 100%; background: #000; font-family: 'Poppins', Arial, sans-serif; color: #fff; overflow: hidden; }

  /* ===== الدائرة البيضاء ===== */
  .circle {
    position: fixed;
    top: 5vh;
    right: -66vh;
    width: 136vh;
    height: 136vh;
    background: #fff;
    border-radius: 50%;
    translate: calc(var(--mx, 0) * 25px) calc(var(--my, 0) * 25px);
    transition: translate .3s ease-out;
  }

  /* ===== المستطيل الزجاجي ===== */
  .glass {
    position: fixed;
    top: 9vh;
    left: 9.5vw;
    width: 81vw;
    height: 84vh;
    height: 84dvh;
    padding: 4vh 6vw;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    background: rgba(120, 120, 120, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.3) transparent;
  }
  .glass > * { flex-shrink: 0; }

  /* ===== القائمة ===== */
  nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .logo { font-size: 44px; font-weight: 800; letter-spacing: 3px; }
  nav ul { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; }
  nav a {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    transition: background .2s, color .2s, box-shadow .2s, transform .2s;
  }
  nav a:hover, nav a:active, nav a:focus-visible {
    background: #fff;
    color: #000;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.4);
    transform: translateY(2px) scale(0.95);
    outline: none;
  }

  /* ===== القسم الرئيسي ===== */
  .hero {
    height: 62vh;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1fr);
    align-items: center;
    gap: 4vw;
  }
  .text h1 { font-size: clamp(28px, 4vw, 52px); font-weight: 800; line-height: 1.1; text-transform: uppercase; margin-bottom: 16px; }
  .accent { color: var(--accent); transition: color .4s; }
  .text p { font-size: 14px; line-height: 1.7; max-width: 340px; margin-bottom: 24px; }

  /* زر Shop Now */
  .btn {
    display: inline-block;
    padding: 14px 34px;
    border-radius: 999px;
    background: #fff;
    color: #000;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 1px;
    text-decoration: none;
    transition: transform .25s, box-shadow .25s;
  }
  .btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 0 25px var(--accent-glow); }
  .btn:active { transform: scale(0.97); }

  /* اختيار اللون */
  .colors { display: flex; gap: 12px; margin-top: 22px; }
  .dot {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
    transition: transform .2s, border-color .2s;
  }
  .dot:hover { transform: scale(1.2); }
  .dot.active { border-color: #fff; transform: scale(1.2); }

  /* ===== الحذاء ===== */
  .image {
    position: relative;
    width: 100%;
    height: 100%;
    translate: calc(var(--mx, 0) * -22px) calc(var(--my, 0) * -22px);
    transition: translate .3s ease-out;
  }
  .image::before {
    content: "";
    position: absolute;
    inset: 8%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
    filter: blur(30px);
    animation: pulse 4s ease-in-out infinite;
  }
  .bg-text {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 7vw; font-weight: 800; letter-spacing: .05em;
    color: rgba(255, 255, 255, 0.1);
    white-space: nowrap; pointer-events: none; user-select: none;
  }
  .image img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation: float 4s ease-in-out infinite;
    transition: rotate .5s ease, scale .5s ease;
    filter: drop-shadow(0 20px 18px rgba(0, 0, 0, 0.45));
  }
  .image:hover img { rotate: -8deg; scale: 1.08; }
  .image::after {
    content: "";
    position: absolute;
    left: 20%; right: 20%; bottom: 4%;
    height: 16px;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 50%;
    filter: blur(10px);
    animation: shadow 4s ease-in-out infinite;
  }

  /* ===== المنتجات ===== */
  .products { padding: 6vh 0 2vh; }
  .products h2 { font-size: clamp(22px, 3vw, 34px); font-weight: 800; margin-bottom: 24px; text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card {
    text-align: center;
    padding: 20px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    transition: transform .3s, box-shadow .3s;
  }
  .card:hover { box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); }
  .card img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; margin-bottom: 12px; }
  .card h3 { font-size: 18px; margin-bottom: 4px; }
  .price { color: var(--accent); font-weight: 600; font-size: 18px; margin-bottom: 14px; transition: color .4s; }
  .buy {
    display: inline-block;
    padding: 10px 26px;
    border-radius: 999px;
    background: #fff;
    color: #000;
    font-weight: 600;
    text-decoration: none;
    transition: transform .25s, box-shadow .25s;
  }
  .buy:hover { transform: scale(1.06); box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }

  /* ===== شاشة التحميل ===== */
  .loader {
    position: fixed; inset: 0; z-index: 9999;
    background: #000;
    display: grid; place-items: center; align-content: center; gap: 24px;
    transition: opacity .8s ease, visibility .8s ease;
  }
  .loader.hide { opacity: 0; visibility: hidden; }
  .loader span {
    font-size: clamp(36px, 8vw, 80px); font-weight: 800; color: #fff;
    animation: loadIn 1.4s ease both;
  }
  .loader .bar { width: 160px; height: 3px; background: rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
  .loader .bar::after {
    content: ""; display: block; height: 100%; background: #fff;
    animation: fill 1.5s ease forwards;
  }

  /* ===== مؤشر الماوس ===== */
  .cursor {
    position: fixed; top: 0; left: 0; z-index: 9998;
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; mix-blend-mode: difference;
    pointer-events: none; opacity: 0;
    transition: width .25s, height .25s, opacity .3s;
  }
  .cursor.big { width: 56px; height: 56px; }
  @media (hover: hover) { body, a, button { cursor: none; } }
  @media (hover: none) { .cursor { display: none; } }

  /* ===== الحركات ===== */
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.8); opacity: .2; } }
  @keyframes pulse { 0%, 100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes loadIn { from { opacity: 0; letter-spacing: .9em; } to { opacity: 1; letter-spacing: .3em; } }
  @keyframes fill { from { width: 0; } to { width: 100%; } }

  nav      { animation: fadeUp .8s ease backwards; }
  .text h1 { animation: fadeUp .8s ease .2s backwards; }
  .text p  { animation: fadeUp .8s ease .4s backwards; }
  .btn     { animation: fadeUp .8s ease .6s backwards; }
  .colors  { animation: fadeUp .8s ease .7s backwards; }
  .image   { animation: fadeUp 1s ease .5s backwards; }

  /* ===== تابلت ===== */
  @media (max-width: 1024px) {
    .logo { font-size: 36px; }
    nav a { padding: 7px 14px; }
  }

  /* ===== جوال عمودي ===== */
  @media (max-width: 700px) {
    .circle { top: auto; bottom: -15vw; right: -55vw; width: 115vw; height: 115vw; }
    .glass { top: 3vh; left: 5vw; width: 90vw; height: 94vh; height: 94dvh; padding: 3vh 5vw; border-radius: 20px; background: rgba(20, 20, 20, 0.6); }
    nav { flex-direction: column; gap: 10px; }
    .logo { font-size: 32px; }
    nav ul { justify-content: center; gap: 6px; }
    nav a { padding: 6px 12px; font-size: 13px; }

    .hero { display: flex; flex-direction: column; height: auto; gap: 16px; padding: 3vh 0; text-align: center; }
    .text h1 { font-size: clamp(22px, 7vw, 34px); margin-bottom: 10px; }
    .text p { font-size: 13px; max-width: none; margin: 0 auto 14px; }
    .btn { padding: 11px 28px; font-size: 14px; }
    .colors { justify-content: center; }
    .image { height: 38vh; flex: none; }
    .bg-text { font-size: 16vw; }

    .products { padding: 5vh 0 2vh; }
    .cards { grid-template-columns: 1fr; }
    .card { padding: 16px; }
    .card img { aspect-ratio: 16 / 10; }
  }

  /* ===== جوال أفقي ===== */
  @media (max-height: 480px) and (orientation: landscape) {
    .glass { top: 4vh; height: 92vh; padding: 2vh 4vw; }
    .hero { height: 85vh; }
    .logo { font-size: 24px; }
    nav a { padding: 4px 10px; font-size: 12px; }
    .text h1 { font-size: 22px; margin-bottom: 6px; }
    .text p { font-size: 11px; margin-bottom: 8px; }
    .btn { padding: 8px 20px; font-size: 12px; }
  }

  /* ===== بدون حركة ===== */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>
  <div class="loader"><span>ADIDAS</span><div class="bar"></div></div>
  <div class="cursor"></div>

  <div class="circle"></div>

  <div class="glass">
    <nav>
      <div class="logo">ADIDAS</div>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Men</a></li>
        <li><a href="#">Women</a></li>
        <li><a href="#">Kids</a></li>
      </ul>
    </nav>

    <section class="hero">
      <div class="text">
        <h1>Adidas company is the <span class="accent">best</span></h1>
        <p>Adidas is one of the best and finest footwear and sportswear companies; it is undoubtedly the best.</p>
        <a href="#" class="btn">Shop Now</a>
        <div class="colors">
          <button class="dot active" data-color="#ff3b3b" style="background:#ff3b3b" aria-label="Red"></button>
          <button class="dot" data-color="#f5c542" style="background:#f5c542" aria-label="Gold"></button>
          <button class="dot" data-color="#3b82ff" style="background:#3b82ff" aria-label="Blue"></button>
          <button class="dot" data-color="#22c55e" style="background:#22c55e" aria-label="Green"></button>
        </div>
      </div>
      <div class="image">
        <div class="bg-text">ADIDAS</div>
        <img src="p/shoe.png" alt="حذاء أديداس">
      </div>
    </section>

    <section class="products">
      <h2>Our Products</h2>
      <div class="cards">
        <div class="card">
          <img src="p/shoe.png" alt="Product 1">
          <h3>Classic Runner</h3>
          <p class="price">$120</p>
          <a href="#" class="buy">Buy Now</a>
        </div>
        <div class="card">
          <img src="p/shoe.png" alt="Product 2">
          <h3>Street Pro</h3>
          <p class="price">$150</p>
          <a href="#" class="buy">Buy Now</a>
        </div>
        <div class="card">
          <img src="p/shoe.png" alt="Product 3">
          <h3>Speed Max</h3>
          <p class="price">$180</p>
          <a href="#" class="buy">Buy Now</a>
        </div>
      </div>
    </section>
  </div>

  <script>
    // شاشة التحميل
    (function () {
      var loader = document.querySelector('.loader');
      function hide() { loader.classList.add('hide'); }
      window.addEventListener('load', function () { setTimeout(hide, 1700); });
      setTimeout(hide, 4000);
    })();

    // تغيير اللون
    (function () {
      var dots = document.querySelectorAll('.dot');
      dots.forEach(function (d) {
        d.addEventListener('click', function () {
          var c = d.dataset.color;
          var r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
          var root = document.documentElement.style;
          root.setProperty('--accent', c);
          root.setProperty('--accent-glow', 'rgba(' + r + ',' + g + ',' + b + ',0.45)');
          dots.forEach(function (x) { x.classList.remove('active'); });
          d.classList.add('active');
        });
      });
    })();

    // حركة الدائرة والحذاء مع الماوس
    document.addEventListener('mousemove', function (e) {
      var x = e.clientX / window.innerWidth - 0.5;
      var y = e.clientY / window.innerHeight - 0.5;
      document.documentElement.style.setProperty('--mx', x);
      document.documentElement.style.setProperty('--my', y);
    });

    if (window.matchMedia('(hover: hover)').matches) {
      // ميلان الكروت
      document.querySelectorAll('.card').forEach(function (card) {
        card.addEventListener('mousemove', function (e) {
          var r = card.getBoundingClientRect();
          var x = (e.clientX - r.left) / r.width - 0.5;
          var y = (e.clientY - r.top) / r.height - 0.5;
          card.style.transition = 'transform .1s';
          card.style.transform = 'perspective(700px) rotateX(' + (-y * 14) + 'deg) rotateY(' + (x * 14) + 'deg) translateY(-8px)';
        });
        card.addEventListener('mouseleave', function () {
          card.style.transition = 'transform .4s';
          card.style.transform = '';
        });
      });

      // مؤشر الماوس
      var cur = document.querySelector('.cursor');
      var tx = 0, ty = 0, cx = 0, cy = 0;
      document.addEventListener('mousemove', function (e) {
        tx = e.clientX; ty = e.clientY; cur.style.opacity = 1;
      });
      (function loop() {
        cx += (tx - cx) * 0.18; cy += (ty - cy) * 0.18;
        cur.style.transform = 'translate(' + (cx - cur.offsetWidth / 2) + 'px,' + (cy - cur.offsetHeight / 2) + 'px)';
        requestAnimationFrame(loop);
      })();
      document.querySelectorAll('a, button, .card').forEach(function (el) {
        el.addEventListener('mouseenter', function () { cur.classList.add('big'); });
        el.addEventListener('mouseleave', function () { cur.classList.remove('big'); });
      });
    }
  </script>

  <!-- العمل بدون إنترنت -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
